<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0c120f;
    color: #eef3ed;
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
    max-width: 100vw;
    overflow-x: hidden;
  }
  h3 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; letter-spacing: -0.02em; }
  .shell { max-width: 1024px; margin: 0 auto; padding: 28px 18px; display: grid; gap: 24px; }
  .panel { background: #101814; border: 1px solid #26322b; border-radius: 16px; padding: 24px; outline: 1px dashed red; }
  .t-clamp { font-size: clamp(26px, 4vw, 34px); outline: 1px dashed orange; }
  .t-plain { font-size: 26px; outline: 1px dashed yellow; }
  .field input {
    width: 100%; font-size: 15px; padding: 12px 14px;
    border: 1px solid #33413a; border-radius: 10px;
    background: #15201a; color: #eef3ed; outline: 1px dashed cyan;
  }
</style>
</head>
<body>
<div class="shell">
  <div class="panel"><h3 class="t-clamp">What did your class just answer?</h3></div>
  <div class="panel"><h3 class="t-plain">What did your class just answer?</h3></div>
  <div class="panel"><div class="field"><input value="Why does ice float on water?"></div></div>
  <div class="panel" id="m"><p id="out" style="font-family:monospace;margin:0">measuring…</p></div>
</div>
<script>
  addEventListener('load', () => {
    document.getElementById('out').textContent =
      'innerWidth=' + innerWidth +
      ' scrollWidth=' + document.documentElement.scrollWidth +
      ' bodyScrollW=' + document.body.scrollWidth;
  });
</script>
</body>
</html>
